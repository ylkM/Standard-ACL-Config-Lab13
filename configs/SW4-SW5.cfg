!
! SW4 - connects to R2 Gi0/1 on one side and cascades to SW5 on the
! other (Gi0/1 <-> Gi0/1). 192.168.2.0/24 segment.
!
hostname SW4
!
enable secret class
no ip domain lookup
!
interface GigabitEthernet0/1
 description Downlink to SW5
 switchport mode trunk
 no shutdown
!
line con 0
 logging synchronous
!
end
!
! ----------------------------------------------------------------
!
! SW5 - connects to SW4 (Gi0/1) and to Server2 (Fa0/1).
!
hostname SW5
!
enable secret class
no ip domain lookup
!
interface GigabitEthernet0/1
 description Uplink to SW4
 switchport mode trunk
 no shutdown
!
interface FastEthernet0/1
 description Server2
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 ip address 192.168.2.253 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.2.254
!
line con 0
 logging synchronous
!
end
