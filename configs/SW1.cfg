!
! SW1 - connects PC3 (Fa0/1) and PC4 (Fa0/2) to R1 Gi0/1 (Fa0 uplink)
! 172.16.2.0/24 segment. All ports in default VLAN 1 - no routing needed.
!
hostname SW1
!
enable secret class
no ip domain lookup
!
interface FastEthernet0/1
 description PC3
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface FastEthernet0/2
 description PC4
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface FastEthernet0/24
 description Uplink to R1 Gi0/1
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 ip address 172.16.2.253 255.255.255.0
 no shutdown
!
ip default-gateway 172.16.2.254
!
line con 0
 logging synchronous
!
end
