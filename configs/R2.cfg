!
! ================================================================
! R2 - Running configuration
! Site B router: connects LAN 192.168.1.0/24 (Server1) and
! LAN 192.168.2.0/24 (Server2) to R1 over the 203.0.113.0/30 WAN link
! ================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
enable secret class
!
no ip domain lookup
!
interface GigabitEthernet0/0
 description LAN--SW (Server1 .100) 192.168.1.0/24
 ip address 192.168.1.254 255.255.255.0
 ip access-group ALLOW_SERVER1 out
 no shutdown
!
interface GigabitEthernet0/1
 description LAN--SW (Server2 .100) 192.168.2.0/24
 ip address 192.168.2.254 255.255.255.0
 ip access-group BLOCK_16_2_TO_SVR2 out
 no shutdown
!
interface Serial0/0/0
 description WAN link to R1 (DTE end)
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 192.168.1.0 0.0.0.255 area 0
 network 192.168.2.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
!
! ----------------------------------------------------------------
! Standard NAMED ACLs (filter by source only -> apply as close
! to the DESTINATION network as possible, direction = out)
! ----------------------------------------------------------------
!
! Applied OUT on Gi0/0 (192.168.1.0/24 LAN, toward Server1)
! Policy: ONLY PC1 (172.16.1.1) and PC3 (172.16.2.1) may reach 192.168.1.0/24
ip access-list standard ALLOW_SERVER1
 remark ONLY PC1 AND PC3 MAY REACH 192.168.1.0/24
 permit host 172.16.1.1
 permit host 172.16.2.1
 deny any
!
! Applied OUT on Gi0/1 (192.168.2.0/24 LAN, toward Server2)
! Policy: 172.16.2.0/24 cannot access 192.168.2.0/24
ip access-list standard BLOCK_16_2_TO_SVR2
 remark BLOCK 172.16.2.0/24 FROM REACHING 192.168.2.0/24
 deny   172.16.2.0 0.0.0.255
 permit any
!
banner motd ^
=====================================================
  R2 - Authorized access only. Standard ACL Lab.
=====================================================
^
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh telnet
!
end
