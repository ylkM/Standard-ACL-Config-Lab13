!
! SW2 - connects PC1 (Fa0/1) and PC2 (Fa0/2) to R1 Gi0/0 (Gi0/1 uplink)
! 172.16.1.0/24 segment. All ports in default VLAN 1 - no routing needed.
!
hostname SW2
!
enable secret class
no ip domain lookup
!
interface FastEthernet0/1
 description PC1
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface FastEthernet0/2
 description PC2
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface GigabitEthernet0/1
 description Uplink to R1 Gi0/0
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 ip address 172.16.1.253 255.255.255.0
 no shutdown
!
ip default-gateway 172.16.1.254
!
line con 0
 logging synchronous
!
end
