!
! SW3 - connects Server1 (Fa0) to R2 Gi0/0 (Gi0/1 uplink)
! 192.168.1.0/24 segment.
!
hostname SW3
!
enable secret class
no ip domain lookup
!
interface FastEthernet0/1
 description Server1
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface GigabitEthernet0/1
 description Uplink to R2 Gi0/0
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 ip address 192.168.1.253 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.1.254
!
line con 0
 logging synchronous
!
end
