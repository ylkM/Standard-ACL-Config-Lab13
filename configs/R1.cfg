!
! ================================================================
! R1 - Running configuration
! Site A router: connects LAN 172.16.1.0/24 (PC1, PC2) and
! LAN 172.16.2.0/24 (PC3, PC4) to R2 over the 203.0.113.0/30 WAN link
! ================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
enable secret class
!
no ip domain lookup
!
interface GigabitEthernet0/0
 description LAN--SW1 (PC1 .1 / PC2 .2) 172.16.1.0/24
 ip address 172.16.1.254 255.255.255.0
 ip access-group 11 out
 no shutdown
!
interface GigabitEthernet0/1
 description LAN--SW2 (PC3 .1 / PC4 .2) 172.16.2.0/24
 ip address 172.16.2.254 255.255.255.0
 ip access-group 10 out
 no shutdown
!
interface Serial0/0/0
 description WAN link to R2 (DCE end - provides clock)
 ip address 203.0.113.1 255.255.255.252
 clock rate 64000
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 172.16.1.0 0.0.0.255 area 0
 network 172.16.2.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
!
! ----------------------------------------------------------------
! Standard NUMBERED ACLs (filter by source only -> apply as close
! to the DESTINATION network as possible, direction = out)
! ----------------------------------------------------------------
!
! ACL 10 - applied OUT on Gi0/1 (172.16.2.0/24 LAN)
! Policy: 172.16.1.0/24 cannot access 172.16.2.0/24
access-list 10 remark BLOCK 172.16.1.0/24 FROM REACHING 172.16.2.0/24
access-list 10 deny   172.16.1.0 0.0.0.255
access-list 10 permit any
!
! ACL 11 - applied OUT on Gi0/0 (172.16.1.0/24 LAN)
! Policy: 172.16.2.0/24 cannot access 172.16.1.0/24
access-list 11 remark BLOCK 172.16.2.0/24 FROM REACHING 172.16.1.0/24
access-list 11 deny   172.16.2.0 0.0.0.255
access-list 11 permit any
!
banner motd ^
=====================================================
  R1 - Authorized access only. Standard ACL Lab.
=====================================================
^
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh telnet
!
end
